[workspace]
resolver = "2"
members = ["crates/arkreunion-core", "crates/arkreunion"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["arkreunion contributors"]

[workspace.dependencies]
arkreunion-core = { path = "crates/arkreunion-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "net", "signal"] }
tracing = "0.1"
dirs = "6"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
fslock = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
