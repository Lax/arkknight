[workspace]
resolver = "2"
members = ["crates/akops-core", "crates/akops"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["akops contributors"]

[workspace.dependencies]
akops-core = { path = "crates/akops-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs"] }
tracing = "0.1"
dirs = "6"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
