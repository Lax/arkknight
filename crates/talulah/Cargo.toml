[package]
name = "akops"
description = "方舟多账号调度中心 CLI 与 Web 控制台"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "akops"
path = "src/main.rs"

[dependencies]
akops-core.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
futures-util.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "akops contributors"
copyright = "2026, akops contributors"
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """方舟多账号调度中心：编排 MAA（账号切换/任务）与 mower（基建排班），\n在少量安卓设备上按时间窗自动轮转运行多个游戏账号。\nWeb 控制台已嵌入二进制（akops server 后访问 http://127.0.0.1:7100）。"""
assets = [
    ["target/release/akops", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/akops/README.md", "644"],
]
