[package]
name = "arkreunion"
description = "方舟多账号调度中心 CLI 与 Web 控制台"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "arkreunion"
path = "src/main.rs"

[dependencies]
arkreunion-core.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
futures-util.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Router 单测用 oneshot 驱动（仅测试期依赖，不进发布二进制）
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[package.metadata.deb]
maintainer = "arkreunion contributors"
copyright = "2026, arkreunion contributors"
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """方舟多账号调度中心：编排 MAA（账号切换/任务）与 mower（基建排班），\n在少量安卓设备上按时间窗自动轮转运行多个游戏账号。\nWeb 控制台已嵌入二进制（arkreunion server 后访问 http://127.0.0.1:7100）。"""
assets = [
    ["target/release/arkreunion", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/arkreunion/README.md", "644"],
]
